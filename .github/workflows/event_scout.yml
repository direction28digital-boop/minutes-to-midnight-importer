name: SnoutHub event scout

# Weekly hunt for dog-friendly events across ALL SnoutHub cities (98).
# Claude (with web search) finds events like a human editor and files them
# as PENDING rows in event_submissions; Dee approves in /admin/events.
# Writes only to Anthropic API + Neon: immune to the Hostinger/GitHub-runner
# flakiness that plagues the WP-touching workflows.
#
# Budget guardrails (Dee's cap: $50/mo total events spend):
#   - MAX_HUBS caps each run (98 cities ~= $12-13/run, ~$55/mo weekly)
#   - Anthropic credits are prepaid with auto-reload off = hard wall

on:
  schedule:
    - cron: "0 15 * * 1"   # Mondays 10:00 CT / 8:00 Phoenix
  workflow_dispatch:
    inputs:
      limit:
        description: "Only scout the first N hubs (0 = all 36)"
        required: false
        default: "0"
      hub:
        description: "Scout a single hubId (e.g. phoenix-az)"
        required: false
        default: ""
      offset:
        description: "Skip the first N hubs (36 = only the non-priority cities)"
        required: false
        default: "0"

concurrency:
  group: event-scout-weekly
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests "psycopg[binary]"

      - name: Run the scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '0' }}
          HUB: ${{ github.event_name == 'workflow_dispatch' && inputs.hub || '' }}
          OFFSET: ${{ github.event_name == 'workflow_dispatch' && inputs.offset || '0' }}
          MAX_HUBS: "100"
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_API_KEY:-}" || -z "${DATABASE_URL:-}" ]]; then
            echo "Missing ANTHROPIC_API_KEY or DATABASE_URL repo secret."
            exit 2
          fi
          ARGS="--hubs-file data_events/hubs.events_all.json"
          if [[ -n "$HUB" ]]; then
            ARGS="$ARGS --hub $HUB"
          else
            if [[ -n "$OFFSET" && "$OFFSET" != "0" ]]; then
              ARGS="$ARGS --offset $OFFSET"
            fi
            if [[ "$LIMIT" != "0" ]]; then
              ARGS="$ARGS --limit $LIMIT"
            else
              ARGS="$ARGS --limit $MAX_HUBS"
            fi
          fi
          python scripts/event_scout.py $ARGS

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
