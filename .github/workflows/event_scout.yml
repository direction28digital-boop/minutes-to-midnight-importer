name: SnoutHub event scout

# Two-tier hunt for dog-friendly events (switched from weekly-98 on 2026-08-03):
#   - WEEKLY MINI-HUNT: Sundays 6:00 AM CT, ACTIVE hubs only
#     (data_events/hubs.events_active.json, 23 cities) so the Sunday 8am
#     social-queue job and the Wednesday post always draw fresh events.
#     ~$0.15/city => ~$3.50/run, ~$15/mo.
#   - FULL SWEEP: 1st + 15th of the month, 10:00 AM CT, all 99 cities
#     (data_events/hubs.events_all.json) as the discovery net for future
#     hubs. ~$14/run, ~$28/mo.
#   Total ~ $40-45/mo, under Dee's $50/mo events cap (weekly-99 was ~$55-60).
# Claude (with web search) finds events like a human editor and files them
# as PENDING rows in event_submissions; Dee approves in /admin/events.
# Writes only to Anthropic API + Neon: immune to the Hostinger/GitHub-runner
# flakiness that plagues the WP-touching workflows.
#
# Budget guardrails:
#   - MAX_HUBS caps each run
#   - Anthropic credits are prepaid with auto-reload off = hard wall

on:
  schedule:
    - cron: "0 11 * * 0"   # WEEKLY MINI: Sundays 6:00 CT — active hubs only
    - cron: "0 15 1,15 * *" # FULL SWEEP: 1st + 15th, 10:00 CT — all 99 cities
  workflow_dispatch:
    inputs:
      scope:
        description: "Hub set: all (99 cities) or active (23 live hubs)"
        required: false
        default: "all"
      limit:
        description: "Only scout the first N hubs (0 = no cap)"
        required: false
        default: "0"
      hub:
        description: "Scout a single hubId (e.g. phoenix-az)"
        required: false
        default: ""
      offset:
        description: "Skip the first N hubs"
        required: false
        default: "0"

concurrency:
  group: event-scout-weekly
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests "psycopg[binary]"

      - name: Run the scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || '' }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '0' }}
          HUB: ${{ github.event_name == 'workflow_dispatch' && inputs.hub || '' }}
          OFFSET: ${{ github.event_name == 'workflow_dispatch' && inputs.offset || '0' }}
          MAX_HUBS: "100"
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_API_KEY:-}" || -z "${DATABASE_URL:-}" ]]; then
            echo "Missing ANTHROPIC_API_KEY or DATABASE_URL repo secret."
            exit 2
          fi
          # Pick the hub set: weekly Sunday cron = active hubs; 1st/15th cron
          # = full 99-city sweep; manual dispatch honors the scope input.
          HUBS_FILE="data_events/hubs.events_all.json"
          if [[ "$SCHEDULE" == "0 11 * * 0" || "$SCOPE" == "active" ]]; then
            HUBS_FILE="data_events/hubs.events_active.json"
          fi
          echo "Hub set: $HUBS_FILE (schedule='$SCHEDULE' scope='$SCOPE')"
          ARGS="--hubs-file $HUBS_FILE"
          if [[ -n "$HUB" ]]; then
            ARGS="$ARGS --hub $HUB"
          else
            if [[ -n "$OFFSET" && "$OFFSET" != "0" ]]; then
              ARGS="$ARGS --offset $OFFSET"
            fi
            if [[ "$LIMIT" != "0" ]]; then
              ARGS="$ARGS --limit $LIMIT"
            else
              ARGS="$ARGS --limit $MAX_HUBS"
            fi
          fi
          python scripts/event_scout.py $ARGS

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
