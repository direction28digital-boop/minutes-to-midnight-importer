name: M2M nightly imports

on:
  schedule:
    # Each run also drafts published animals missing from the current RG
    # snapshot (draft_missing_published_animals), i.e. adopted dogs come
    # off the site on every import. Two runs/day halve the worst-case
    # window a "meet me" dog stays visible after adoption (~24h → ~12h).
    - cron: '0 9 * * *'    # 02:00 Phoenix
    - cron: '0 21 * * *'   # 14:00 Phoenix
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: m2m-nightly-imports
  cancel-in-progress: false

jobs:
  imports:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity-check required secrets
        env:
          RG_API_KEY: ${{ secrets.RG_API_KEY }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          for v in RG_API_KEY WP_BASE_URL WP_USER WP_PASSWORD NEON_DATABASE_URL BLOB_READ_WRITE_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret: $v"
              exit 1
            fi
          done
          echo "Secrets look present."

      - name: Run RescueGroups importer
        env:
          RG_API_KEY: ${{ secrets.RG_API_KEY }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
        run: |
          python rg_fetch_and_normalize_http.py

      # Rehost any new RescueGroups photo URLs into Vercel Blob +
      # m2mr.media_assets. Idempotent: already-mapped (and tombstoned-dead)
      # URLs are skipped, so this only uploads what this import introduced —
      # it keeps blob coverage at ~100% so the site never has to fall back
      # to RG's CDN. Reads the snapshot the importer just wrote.
      - name: Rehost new photos to Vercel Blob
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          python scripts/rehost_media_assets.py \
            --in data/animals.normalized.jsonl \
            --concurrency 4 \
            --progress-every 200

      # Cap blob storage: delete images of dogs that left the feed >90 days
      # ago. MUST run after the rehost step — rehost bumps last_seen_at for
      # the whole current feed, which is what protects live dogs' images.
      # Content-shared blobs (littermates etc.) are only deleted when no
      # live row references them.
      - name: Clean up stale blobs
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          python scripts/cleanup_stale_blobs.py --days 90

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
