name: M2M events imports

on:
  schedule:
    # 1x daily. The old 3x/day cadence was a deliberate burn of a SerpAPI
    # credit batch that expired 2026-03-26 — long done. One morning run
    # (with --allow-cache for free server-side cached responses) keeps the
    # events fresh at a third of the spend (2026-07 automations audit).
    # Phoenix = UTC-7 year-round
    - cron: "20 13 * * *"   # 06:20 Phoenix (morning)
  workflow_dispatch:
    inputs:
      daily_cap:
        description: "How many SerpAPI searches to run this execution"
        required: false
        default: "50"
      dry_run:
        description: "Set to 1 to test without spending credits"
        required: false
        default: "0"

concurrency:
  group: serpapi-events-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug repo layout
        shell: bash
        run: |
          set -euo pipefail
          pwd
          ls -la
          echo "---- scripts ----"
          ls -la scripts || true
          echo "---- data_events ----"
          ls -la data_events || true

      - name: Create venv + install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-events
          ./.venv-events/bin/python -m pip install --upgrade pip
          ./.venv-events/bin/python -m pip install requests

      - name: Run capped SerpAPI fetch
        shell: bash
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          DAILY_CAP: ${{ github.event_name == 'workflow_dispatch' && inputs.daily_cap || '50' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          # 2026-07-28 rework: Google Events stopped answering the old niche
          # dog phrasings entirely, and any htichips date filter zeroes out
          # niche queries. "pet events in <city>" is the phrasing that still
          # returns real results (verified live: Pup Festival, Cause for
          # Paws). One term x no filter x 22 hubs = ~22 searches/day, well
          # inside the 1,000/mo plan. Expired events are dropped site-side.
          TERMS: "pet events"
          DATE_FILTERS: "none"
          STARTS: "0"
          # Faster throttle to finish each run quickly
          THROTTLE: "2.0"
        run: |
          set -euo pipefail
          echo "event_name=${{ github.event_name }}"
          echo "DAILY_CAP=$DAILY_CAP"
          echo "DRY_RUN=$DRY_RUN"
          if [[ -z "${SERPAPI_API_KEY:-}" ]]; then
            echo "SERPAPI_API_KEY is missing (repo secret not set for this repo/environment)."
            exit 2
          fi
          test -f scripts/serpapi_run_with_daily_cap.sh || { echo "Missing scripts/serpapi_run_with_daily_cap.sh"; exit 2; }
          chmod +x scripts/serpapi_run_with_daily_cap.sh
          ./scripts/serpapi_run_with_daily_cap.sh

      - name: Normalize (optional but useful)
        shell: bash
        run: |
          set -euo pipefail

          if compgen -G "data_events/raw/**/*.jsonl" > /dev/null; then
            echo "Found raw input files. Running normalize."
            ./.venv-events/bin/python scripts/normalize_serpapi_google_events.py \
              --in-glob "data_events/raw/**/*.jsonl" \
              --out "data_events/events.normalized.jsonl"
          else
            echo "No raw event files found at data_events/raw/**/*.jsonl. Skipping normalize."
          fi

      - name: Upsert events to WordPress
        shell: bash
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
        run: |
          set -euo pipefail
          if [[ ! -f data_events/events.normalized.jsonl ]]; then
            echo "No normalized events file. Skipping WP upsert."
            exit 0
          fi
          ./.venv-events/bin/python scripts/upsert_events_to_wp.py

      # Pull the fresh WP events straight into the site's Neon DB so new
      # events show up the same morning instead of waiting for the site's
      # own 9:00 UTC cron (which runs BEFORE this fetch). Requires the
      # CRON_SECRET repo secret (same value as the Vercel env var);
      # skips quietly if unset.
      - name: Trigger site import (WP -> Neon)
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "CRON_SECRET not set. Site picks up events at its next 9:00 UTC cron."
            exit 0
          fi
          curl -fsS -m 290 -H "Authorization: Bearer $CRON_SECRET" \
            "https://snouthub.com/api/cron/import-events" || \
            echo "::warning::Site import trigger failed; the 9:00 UTC cron will catch up."

      - name: Upload normalized + run manifests (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: events-normalized-and-manifests
          path: |
            data_events/events.normalized.jsonl
            data_events/dataRan/serpapi_runs/*.json
          if-no-files-found: ignore

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
